# DWES simulation configuration (paper-aligned).
#
# Run:
#   python run_from_config.py train conf/config.yaml
#
# Notes:
# - This file is intentionally flat: each key below maps either to a
#   SimulationConfig field in simulation_methods.py or to run_grid controls.
# - p_values and taus control the simulation grid. The single p and tau fields
#   are base values and are overwritten by p_values/taus during run_grid.
# - Use null when you want the code to use its default formula, e.g. lambda_q: null.
#
# The four reported methods, examples, and default grid follow
# Section 5 (Simulation Studies) of the paper.

# ---------------------------------------------------------------------------
# Grid and output settings
# ---------------------------------------------------------------------------

# p_values: list[int]
# Cross-sectional dimensions p. Paper simulations use [500, 1000, 1500, 2000].
p_values: [500, 1000, 1500, 2000]

# taus: list[float]
# ES/quantile tail levels. Paper uses [0.05, 0.10, 0.20].
taus: [0.05, 0.10, 0.20]

# methods: list[str]
# Methods to run, named as in the paper.
# Allowed values: RLR, KRR, FA-NN, FAIR-NN.
#   RLR     regularized two-step linear ES regression (Zhang et al., 2025)
#   KRR     two-step kernel ridge regression with a Gaussian RBF kernel (Yu et al., 2024)
#   FA-NN   factor-augmented neural network (non-iterative, unweighted)
#   FAIR-NN factor-augmented iterative reweighting neural network (proposed)
methods: [RLR, KRR, FA-NN, FAIR-NN]

# output: str
# CSV output path. Relative paths are resolved next to run_from_config.py.
output: results_from_config.csv

# ---------------------------------------------------------------------------
# Data-generating design (select the paper example via these switches)
# ---------------------------------------------------------------------------
# Example 1 (factor only):
#   factor_model: true,  heterogeneity: none,  design: linear    -> Case 1a
#   factor_model: true,  heterogeneity: none,  design: nonlinear -> Case 1b
# Example 2 (factor + sparse idiosyncratic heterogeneity):
#   factor_model: true,  heterogeneity: linear,    design: linear    -> Case 2a
#   factor_model: true,  heterogeneity: nonlinear, design: nonlinear -> Case 2b
# Example 3 (no factor):
#   factor_model: false, nonfactor_case: 3a -> Case 3a
#   factor_model: false, nonfactor_case: 3b -> Case 3b
#
# The block below reproduces Example 1, Case 1a.

# design: str -> linear | nonlinear
design: linear

# factor_model: bool -> true (X = B f + u) | false (X = u, Example 3)
factor_model: true

# nonfactor_distribution: str (used only when factor_model: false)
# normal-iid | normal-ar | copula-beta  (Example 3 distributions i/ii/iii)
nonfactor_distribution: normal-ar

# nonfactor_case: str (used only when factor_model: false) -> current | 3a | 3b
nonfactor_case: 3a

# heterogeneity: str -> none (Ex.1) | linear (Ex.2 Case 2a) | nonlinear (Ex.2 Case 2b)
# Ignored when factor_model: false.
heterogeneity: none

# innovation: str -> t3 | normal | gamma
innovation: normal

# ---------------------------------------------------------------------------
# Sample sizes and factor projection (paper settings)
# ---------------------------------------------------------------------------

# n_train / n_test: paper uses 2000 / 1000.
n_train: 2000
n_test: 1000

# n_unlabeled: unlabeled observations for the diversified projection.
# Paper uses n_0 = 0.1 * n_train.
n_unlabeled: 200

# p: base dimension; overwritten by p_values during grid runs.
p: 500

# r: true latent factor dimension. Paper uses r = 8.
r: 8

# r_bar: diversified/estimated factor dimension used as network input (r_0 >= r).
r_bar: 16

# tau: base tail level; overwritten by taus during grid runs.
tau: 0.10

# ---------------------------------------------------------------------------
# Training controls (paper: depth 3, width 64, Adam lr 1e-4, 200 epochs)
# ---------------------------------------------------------------------------

epochs: 200
repeats: 100
batch_size: 256
learning_rate: 0.0001
seed: 2026
device: cpu

# ---------------------------------------------------------------------------
# FA-NN / FAIR-NN sparse throughput controls
# ---------------------------------------------------------------------------

# throughput_dim: sparse throughput dimension N. Use 0 to disable throughput.
throughput_dim: 8
truncation: 3.0
penalty_eps: 0.005
# lambda_q: null -> code uses 1.3 * log(p) / n_train.
lambda_q: null

# ---------------------------------------------------------------------------
# Quantile loss
# ---------------------------------------------------------------------------

# quantile_loss: pinball | huber
quantile_loss: pinball
quantile_huber_kappa: 0.1

# ---------------------------------------------------------------------------
# Sparse heterogeneity controls (used when heterogeneity != none)
# ---------------------------------------------------------------------------

# heterogeneity_distribution: idiosyncratic component distribution.
# normal-sparse | t3-sparse | uniform | normal | normal-ar | t3
heterogeneity_distribution: normal
heterogeneity_location_strength: 0.5
heterogeneity_scale_strength: 0.25

# ---------------------------------------------------------------------------
# KRR settings
# ---------------------------------------------------------------------------

# krr_kernel: auto | rbf | gaussian | polynomial
krr_kernel: gaussian

# ---------------------------------------------------------------------------
# RLR (internal HDES) settings
# ---------------------------------------------------------------------------

# If null, the code uses sqrt(log(p) / n_train), matching the paper's order.
hdes_lambda_q: null
hdes_lambda_e: null
hdes_learning_rate: null
hdes_epochs: null

# ---------------------------------------------------------------------------
# Weighted ES stabilization
# ---------------------------------------------------------------------------

# c_h: null -> c_h = c_h_scale * Q_{c_h_quantile}(pilot variance estimates).
c_h: null
c_h_quantile: 0.05

# ---------------------------------------------------------------------------
# Bootstrap confidence intervals (Example 4; FAIR-NN only)
# ---------------------------------------------------------------------------

# bootstrap_B: number of Exp(1) multiplier bootstrap replications.
# Paper uses B = 1000. Use 0 to disable bootstrap CI.
bootstrap_B: 0
ci_level: 0.95
save_bootstrap_ci: false
bootstrap_ci_output_dir: bootstrap_ci
